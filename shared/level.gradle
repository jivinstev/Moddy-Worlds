// THE BUILD EVERY WORLD SHARES, applied by each world's build.gradle after its plugins block:
//
//   plugins { id 'java-library'; id 'net.neoforged.gradle.userdev' version '7.1.39' }
//   ext.levelId = 'isle'                        // the world's folder, level id and world files' name
//   apply from: '../shared/level.gradle'
//
// It reads the world's gradle.properties (mod_id, versions, mod metadata), core.lock (the public core jar, pinned by
// version and sha256) and datapacks.lock.json (its built-in packs, pinned by sha1), and gives every world the same:
//   * the shared level code (shared/src/main/java, package com.moddingfromamod.levels.shared) compiled INTO the world's
//     jar under the world's own package, com.moddingfromamod.levels.<levelId>.shared, so two world jars in one game
//     never carry the same package; and shared/src/test/java into its unit tests the same way;
//   * shared/resources: META-INF/neoforge.mods.toml (templated from gradle.properties) and the access transformer the
//     World Type listener needs, applied to the dev Minecraft too;
//   * the built-in packs unpacked into datapacks/<folder>/ with THIRD_PARTY_NOTICES.txt beside them, and the level's
//     empty marker pack, datapacks/level_marker/, which is what claims a world for it (shared Level.MARKER);
//   * the repository's LICENSE in the jar, the dev runs, and -Plevel=on to switch the world on by properties.
// A world's own build.gradle may set ext.levelRunProps = { manifest -> [key: value] } before applying this, for the
// extra moddingfromamod.<key> properties -Plevel=on passes (the Isle's islands.spacing).

import java.security.MessageDigest

def levelId = project.ext.levelId
def sharedDir = rootProject.file('../shared')

def digestOf = { File f, String algo ->
    def md = MessageDigest.getInstance(algo)
    f.withInputStream { s -> byte[] b = new byte[1 << 16]; int n; while ((n = s.read(b)) > 0) { md.update(b, 0, n) } }
    md.digest().encodeHex().toString()
}

// ── the public core jar, pinned ──────────────────────────────────────────────────────────────────────────────────────
// core.lock is GENERATED from this world's Port CI workflow (.github/workflows/port-ci-<world>.yml, its --dep-jar pin) by
// tools/core-pins.py; the build reads it and refuses bytes it does not pin. Where the jar comes from, in this order:
//   1. -PcoreJar=<jar>: a local core build, taken UNCHECKED (a loud warning; the jar is marked, never released);
//   2. mavenLocal (~/.m2) holding com.moddingfromamod:moddingfromamod:<the pinned core's version> (or
//      <version>-mc<minecraft>, the spelling a version branch's pin may use), which Port CI's
//      --dep-jar step puts there: sha256-checked against core.lock like any other copy, EXCEPT on Port CI's dependent
//      gate, when PORT_CI_DEP_OVERRIDE (a comma list of group:artifact the run swapped for a candidate) names exactly
//      com.moddingfromamod:moddingfromamod: then that jar is taken unchecked, exactly like -PcoreJar (warned, marked);
//   3. else <world>/.core/<asset>: downloaded from the core's release when absent, sha256-checked against core.lock.
// A marked jar carries the manifest attribute Moddy-Unpinned-Core, which tools/check-level-jar.py refuses.
def lock = new Properties()
file('core.lock').withInputStream { lock.load(it) }
def coreDir = file('.core')
def coreJar
def unpinned = null                     // why this build is NOT against the pinned core (the jar's marker), or null
def coreGa = 'com.moddingfromamod:moddingfromamod'
def coreTagPrefix = 'moddingfromamod-'
def coreTagSuffix = "-mc${minecraft_version}"
// The pinned core's version: its tag is moddingfromamod-<version>-mc<minecraft> (tools/core-pins.py --check holds the
// workflow's G:A:V to the same version).
def coreVersion = (lock.core_tag ?: '').startsWith(coreTagPrefix) && (lock.core_tag ?: '').endsWith(coreTagSuffix) ?
        lock.core_tag.substring(coreTagPrefix.length(), lock.core_tag.length() - coreTagSuffix.length()) : null
// Port CI installs it under the version its --dep-jar names: <version> on neoforge-1.21.8, and on a version branch
// whatever MMVU's substitute.com.moddingfromamod\:moddingfromamod in .port/<mc>/branch.properties says, which may be
// <version>-mc<minecraft>. Both are looked for, so the dependent gate (PORT_CI_DEP_OVERRIDE) never misses the candidate
// it put there and silently builds against the pinned core instead (when both are there, the dependent gate takes the
// newer file: the candidate it has just written).
def depOverride = ((System.getenv('PORT_CI_DEP_OVERRIDE') ?: '') as String).split(',').collect { it.trim() }.findAll { it }
def m2Jars = coreVersion ? [coreVersion, "${coreVersion}${coreTagSuffix}".toString()].collect { v ->
    new File(System.getProperty('user.home'),
            ".m2/repository/${coreGa.replace(':', '/').replace('.', '/')}/${v}/moddingfromamod-${v}.jar")
}.findAll { it.isFile() } : []
def m2Jar = depOverride.contains(coreGa) ? m2Jars.max { it.lastModified() } : (m2Jars ? m2Jars[0] : null)
if (depOverride.contains(coreGa) && m2Jar == null && !project.hasProperty('coreJar')) {
    throw new GradleException("${levelId}: PORT_CI_DEP_OVERRIDE names ${coreGa}, but mavenLocal holds no candidate under " +
            "${coreVersion} or ${coreVersion}${coreTagSuffix} (core.lock's ${lock.core_tag}): refusing to build against " +
            "the pinned core in its place")
}
if (project.hasProperty('coreJar')) {
    coreJar = file(project.property('coreJar'))
    if (!coreJar.isFile()) {
        throw new GradleException("${levelId}: -PcoreJar=${coreJar} is not a file")
    }
    unpinned = "-PcoreJar=${coreJar.name}"
    logger.warn("${levelId}: WARNING: building against ${coreJar} (-PcoreJar), NOT the pinned core (core.lock); " +
            "the jar is marked Moddy-Unpinned-Core and is never released")
} else if (m2Jar != null && m2Jar.isFile() && depOverride.contains(coreGa)) {
    coreJar = m2Jar
    unpinned = "PORT_CI_DEP_OVERRIDE=${coreGa}"
    logger.warn("${levelId}: WARNING: building against ${m2Jar} UNCHECKED: Port CI's dependent gate replaced ${coreGa} " +
            "(PORT_CI_DEP_OVERRIDE), so this is NOT the pinned core (core.lock); the jar is marked Moddy-Unpinned-Core " +
            "and is never released")
} else {
    if (!(lock.core_sha256 ==~ /[0-9a-f]{64}/)) {
        throw new GradleException("${levelId}: core.lock has no sha256 for ${lock.core_asset} yet (core_sha256=${lock.core_sha256}). " +
                "Set the pin with tools/core-pins.py --set ${levelId} <core tag>, or build against a local core jar with -PcoreJar=<jar>")
    }
    if (m2Jar != null && m2Jar.isFile()) {
        // Port CI's --dep-jar step put the pinned core into mavenLocal: the same bytes, checked again here.
        coreJar = m2Jar
        def got = digestOf(coreJar, 'SHA-256')
        if (got != lock.core_sha256) {
            throw new GradleException("${levelId}: sha256 MISMATCH for ${m2Jar} (mavenLocal): core.lock pins ${lock.core_sha256}, " +
                    "got ${got}; refusing to build against bytes nobody pinned (delete that file to fall back to the " +
                    "pinned download)")
        }
        logger.lifecycle("${levelId}: the pinned core from mavenLocal (${coreGa}:${m2Jar.parentFile.name}), sha256 matches core.lock")
    } else {
        coreJar = new File(coreDir, lock.core_asset)
        if (!coreJar.isFile()) {
            // tools/fetch-core.sh fetches the same bytes (with a token, if the core's repository is ever private again).
            def url = "https://github.com/${lock.core_repo}/releases/download/${lock.core_tag}/${lock.core_asset}"
            logger.lifecycle("${levelId}: downloading the core jar ${url}")
            coreDir.mkdirs()
            def part = new File(coreDir, lock.core_asset + '.part')
            try {
                new URL(url).withInputStream { i -> part.withOutputStream { o -> o << i } }
            } catch (Exception e) {
                part.delete()
                throw new GradleException("${levelId}: could not download ${url} (${e.message}). If the core's repository " +
                        "is private: GH_TOKEN=<a token that can read it> tools/fetch-core.sh ${levelId}")
            }
            part.renameTo(coreJar)
        }
        def got = digestOf(coreJar, 'SHA-256')
        if (got != lock.core_sha256) {
            coreJar.delete()
            throw new GradleException("${levelId}: sha256 MISMATCH for ${lock.core_asset}: pinned ${lock.core_sha256}, got ${got}. " +
                    "The file was deleted; refusing to build against bytes nobody pinned")
        }
    }
}

version = "${mod_version}+mc${minecraft_version}"   // the store-jar shape, as the core: <modid>-<version>+mc<mc>.jar
group = "com.moddingfromamod.levels.${levelId}"
base { archivesName = mod_id }
java.toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)

// ── the shared level code, in this world's own package ───────────────────────────────────────────────────────────────
def sharedPkg = 'com/moddingfromamod/levels/shared/'
def ownPkg = "com/moddingfromamod/levels/${levelId}/shared/"
def relocate = { String srcSet ->
    tasks.register("${srcSet}LevelShared", Copy) {
        def out = layout.buildDirectory.dir("generated/shared/${srcSet}")
        from(new File(sharedDir, "src/${srcSet}/java"))
        into(out)
        include("${sharedPkg}**/*.java")
        eachFile { it.path = it.path.replace(sharedPkg, ownPkg) }
        includeEmptyDirs = false
        filter { String line -> line.replace('com.moddingfromamod.levels.shared', "com.moddingfromamod.levels.${levelId}.shared") }
    }
}
def sharedMain = relocate('main')
def sharedTest = relocate('test')
sourceSets.main.java.srcDir(sharedMain)
sourceSets.test.java.srcDir(sharedTest)

// What only the LEVEL jar carries: its world preset and World Type entry, its name, its world files (worlds/), and
// (generated below) its built-in packs.
sourceSets.main.resources.srcDir 'src/level/resources'
def levelPacks = layout.buildDirectory.dir('generated/level-packs')
sourceSets.main.resources.srcDir levelPacks

def packCache = file("${gradle.gradleUserHomeDir}/caches/moddy-worlds/datapacks")
def unpackLevelPacks = tasks.register('unpackLevelPacks') {
    inputs.file('datapacks.lock.json')
    inputs.file('THIRD_PARTY_NOTICES.txt')
    inputs.property('mod_name', mod_name)
    outputs.dir(levelPacks)
    doLast {
        def packs = new groovy.json.JsonSlurper().parse(file('datapacks.lock.json')).packs
        def dir = levelPacks.get().asFile
        project.delete(dir)
        packCache.mkdirs()
        packs.each { id, row ->
            def zip = new File(packCache, row.file)
            if (!zip.isFile() || digestOf(zip, 'SHA-1') != row.sha1) {
                logger.lifecycle("${levelId}: downloading ${id} ${row.version}")
                def part = new File(packCache, row.file + '.part')
                new URL(row.url).withInputStream { i -> part.withOutputStream { o -> o << i } }
                part.renameTo(zip)
            }
            def got = digestOf(zip, 'SHA-1')
            if (got != row.sha1) {
                zip.delete()
                throw new GradleException("${levelId}: sha1 MISMATCH for ${id}: pinned ${row.sha1}, got ${got}; the file was deleted")
            }
            project.copy { from(project.zipTree(zip)); into(new File(dir, "datapacks/${row.folder}")) }
        }
        project.copy { from('THIRD_PARTY_NOTICES.txt'); into(dir) }
        // The marker pack every level carries (shared Level.MARKER): empty, ticked with the level's packs by its World
        // Type and named in a server's initial-enabled-packs; its presence is what claims a world for the level.
        def marker = new File(dir, 'datapacks/level_marker')
        marker.mkdirs()
        new File(marker, 'pack.mcmeta').text = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(
                [pack: [pack_format: 81, description: "${mod_name}: marks a world made as this level (empty)".toString()]])) + '\n'
    }
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // The public core mod: compiled against, and loaded as a mod in every dev run (a classpath jar with a mods.toml).
    // Its libraries come from INSIDE it (META-INF/jarjar/): naming them again stops the boot.
    implementation files(coreJar)
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

test {
    useJUnitPlatform()
}

// The access transformer applies to the dev Minecraft too, so the World Type listener compiles.
minecraft {
    accessTransformers {
        file(new File(sharedDir, 'resources/META-INF/accesstransformer.cfg'))
    }
}

runs {
    configureEach {
        workingDirectory project.layout.projectDirectory.dir('run').dir(name)
        modSource project.sourceSets.main
        systemProperty 'forge.logging.console.level', 'info'
        // -Plevel=on: the world switched on by properties, as a server's launcher would (its world id, its rules file,
        // and whatever ext.levelRunProps adds from its manifest), for a dev world not made with its World Type.
        // -PmoddyProps=k=v,k=v adds any other moddingfromamod.<k>.
        if (project.findProperty('level') == 'on') {
            def manifest = new groovy.json.JsonSlurper().parse(file("src/level/resources/worlds/${levelId}.json"))
            systemProperty 'moddingfromamod.world.id', levelId
            systemProperty 'moddingfromamod.world.rules', file("src/level/resources/worlds/rules/${levelId}.rules.json").absolutePath
            if (project.ext.has('levelRunProps')) {
                project.ext.levelRunProps(manifest).each { k, v -> systemProperty "moddingfromamod.${k}", "${v}" }
            }
        }
        ((project.findProperty('moddyProps') ?: '') as String).split(',').findAll { it.contains('=') }.each {
            def (k, v) = it.split('=', 2)
            systemProperty "moddingfromamod.${k}", v
        }
    }
    server {
        arguments.add '--nogui'
    }
    client {
    }
}

def templateProps = [mod_id: mod_id, mod_name: mod_name, mod_version: mod_version, mod_license: mod_license,
                     mod_authors: mod_authors, mod_description: mod_description, core_mod_id: core_mod_id,
                     core_version_range: core_version_range, minecraft_version_range: minecraft_version_range]
tasks.named('processResources') {
    dependsOn unpackLevelPacks
    inputs.properties templateProps
    from(new File(sharedDir, 'resources'))
    filesMatching('META-INF/neoforge.mods.toml') { expand templateProps }
}

tasks.named('jar') {
    from(rootProject.file('../LICENSE')) { rename { "LICENSE_${mod_id}" } }
    // The marker of a build that is not against the pinned core (-PcoreJar, or Port CI's dependent gate): absent from
    // every pinned build, refused by tools/check-level-jar.py, so such a jar is never released.
    inputs.property('unpinnedCore', unpinned ?: '')
    if (unpinned) {
        manifest { attributes('Moddy-Unpinned-Core': unpinned) }
    }
}

// ── the jar check, in every build ────────────────────────────────────────────────────────────────────────────────────
// `assemble` (so `build`, which Port CI runs) checks the jar it made: tools/check-level-jar.py (only the world's own
// packages, resources and packs; nothing a stock client cannot draw; no package the core it was built against carries;
// no Moddy-Unpinned-Core marker), then tools/leak-scan.py over the jar's contents (datapacks/ is third-party and
// unmodified, pinned by sha1 in datapacks.lock.json: not our text). Both need python3. A build that is itself unpinned
// passes --allow-unpinned: it says so and goes on (so a dependent gate still tests), and its jar stays marked.
def toolsDir = rootProject.file('../tools')
def jarScanDir = layout.buildDirectory.dir('tmp/level-jar-scan')
def unpackLevelJar = tasks.register('unpackLevelJarForScan', Sync) {
    from(zipTree(tasks.named('jar').flatMap { it.archiveFile }))
    exclude('datapacks/**')
    into(jarScanDir)
}
def runPython = { List<String> args, String what ->
    def cmd = ['python3'] + args
    def proc
    try {
        proc = new ProcessBuilder(cmd).redirectErrorStream(true).start()
    } catch (IOException e) {
        throw new GradleException("${levelId}: ${what} needs python3 on the PATH, and there is none (${e.message}). " +
                "Install Python 3 (standard library only), then build again")
    }
    proc.outputStream.close()
    // through Gradle's logger, so the findings reach the console (a daemon's own stdout does not)
    proc.inputStream.withReader('UTF-8') { r -> r.eachLine { logger.lifecycle(it) } }
    def rc = proc.waitFor()
    if (rc != 0) {
        throw new GradleException("${levelId}: ${what} failed (exit ${rc}): see its findings above")
    }
}
def checkLevelJar = tasks.register('checkLevelJar') {
    group = 'verification'
    description = 'tools/check-level-jar.py and the leak scan over the world jar this build made'
    dependsOn(unpackLevelJar)
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    inputs.file(jarFile)
    inputs.property('unpinnedCore', unpinned ?: '')
    doLast {
        def jar = jarFile.get().asFile
        runPython([new File(toolsDir, 'check-level-jar.py').path, jar.path, '--level', levelId, '--core', coreJar.path] +
                (unpinned ? ['--allow-unpinned'] : []), 'tools/check-level-jar.py')
        runPython([new File(toolsDir, 'leak-scan.py').path, '--dir', jarScanDir.get().asFile.path],
                'the leak scan of the jar (tools/leak-scan.py --dir)')
    }
}
tasks.named('assemble') { dependsOn(checkLevelJar) }

// What this world's jar ships from others carries an allow-listed licence (CONTRIBUTING.md): every library inside its
// META-INF/jarjar/ and every datapack its datapacks.lock.json pins. Part of `check`, so of `build`.
def licenceStamp = layout.buildDirectory.file('licence-check.txt')
def licenceCheck = tasks.register('licenceCheck', Exec) {
    group = 'verification'
    description = "What this world's jar bundles from others is on the licence allow-list"
    def jarFile = tasks.named('jar').flatMap { it.archiveFile }
    dependsOn tasks.named('jar')
    def scanner = rootProject.file('../tools/licence-scan.py')
    inputs.files(jarFile, file('datapacks.lock.json'), scanner, rootProject.file('../tools/licence-rules.json'))
    outputs.file licenceStamp
    doFirst {
        commandLine 'python3', scanner.path, '--bundled', jarFile.get().asFile.path, '--lock', file('datapacks.lock.json').path
    }
    doLast { licenceStamp.get().asFile.text = 'licence-scan --bundled passed\n' }
}
tasks.named('check') { dependsOn licenceCheck }
