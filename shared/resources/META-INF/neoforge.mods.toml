modLoader="javafml"
loaderVersion="[1,)"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''
${mod_description}
'''

# The core mod: REQUIRED, and loaded BEFORE this one, so its plug-in list and settings exist when this mod starts.
[[dependencies.${mod_id}]]
    modId="${core_mod_id}"
    type="required"
    versionRange="${core_version_range}"
    ordering="AFTER"
    side="BOTH"

[[dependencies.${mod_id}]]
    modId="minecraft"
    type="required"
    versionRange="${minecraft_version_range}"
    ordering="NONE"
    side="BOTH"


# The Create World screen's pack path, for the level's World Type (META-INF/accesstransformer.cfg, shared by every level)
[[accessTransformers]]
file="META-INF/accesstransformer.cfg"
