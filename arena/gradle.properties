# The Moddy Arena world jar. Minecraft and NeoForge are the public core's: they must match the core jar pinned in core.lock.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.caching=true

minecraft_version=1.21.10
minecraft_version_range=[1.21.10,1.21.11)
neo_version=21.10.64
java_version=21
# This Minecraft's data-pack format: the level marker pack declares it (shared/level.gradle).
level_pack_format=88

mod_id=moddyarena
mod_name=Moddy Arena
mod_version=0.1.5
mod_license=MPL-2.0
mod_authors=Moddy contributors
mod_description=Moddy Arena, a Moddy world: a prep room beside a walled arena, where waves of mobs come to fight.
# The core mod it requires, and the version range it accepts.
core_mod_id=moddingfromamod
core_version_range=[1.0.9,)
# The world's own Java packages besides com.moddingfromamod.levels.<world> (its @Mod class, its code and the shared
# code): tools/check-level-jar.py refuses a class anywhere else in the jar. Keep new code under levels.<world>: the
# core never uses that name, while a package such as com.moddingfromamod.<world> may already be the core's (FML then
# refuses to load the two jars together).
level_packages=
