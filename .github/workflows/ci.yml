# CI: nothing private and no credential gets into this repository, and every world's core pin is one pin.
#
#   no-private-work  the scanners' self-tests; tools/core-pins.py --check (each world's core.lock is exactly its Port CI
#                    workflow's --dep-jar pin, and that core is inside the world's core_version_range); then
#                    tools/leak-scan.py over every tracked file AND every commit in the history (its built-in rules,
#                    tools/leak-rules.txt, and the maintainers' private forbidden list when the FORBIDDEN_LIST secret is
#                    set), then tools/secret-scan.py over the tree and the history. A finding never prints what matched.
#                    Then tools/licence-scan.py: no third-party code or text under a licence off the allow-list, in the
#                    tree or any commit, and every foreign copyright registered in THIRD_PARTY.md (CONTRIBUTING.md).
#
#   worlds           which worlds the change touches (tools/changed-worlds.py: a world's own folder builds that world;
#                    shared/, tools/, .github/ or the Gradle wrapper build them all; a manual run builds them all)
#   world            for each of them: its Gradle `build` -- the core core.lock pins (shared/level.gradle downloads it
#                    and checks its sha256), unit tests, the jar, checkLevelJar (tools/check-level-jar.py and the leak
#                    scan of the jar's contents) and licenceCheck.
#
# main is the working branch; neoforge-1.21.8 is the release branch. Each world's Port CI workflow
# (.github/workflows/port-ci-<world>.yml, generated by MMVU's tools/port-ci.py, never edited by hand) builds, gates and
# releases neoforge-1.21.8 only, so a pull request to main gets its world builds here.
# .github/workflows/release-line.yml checks that neoforge-1.21.8 holds nothing main does not.
#
# Light on purpose: pull requests to main and a manual run (Actions -> CI -> Run workflow), nothing on a push to a
# feature branch, and a newer push to a PR cancels the older run.
#
# Secrets (Settings -> Secrets and variables -> Actions), optional:
#   FORBIDDEN_LIST   the maintainers' private forbidden list, as text (the format of tools/leak-scan.py). Absent, the
#                    scan runs the committed rules only; a pull request from a fork never sees it.
name: CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  no-private-work:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The scanners' rules can still go red
        run: |
          python3 tools/test-leak-scan.py
          python3 tools/test-secret-scan.py
          python3 tools/test-licence-scan.py
          python3 tools/check-level-jar.py --self-test
          python3 tools/changed-worlds.py --self-test
          python3 tools/test-release-line.py
          python3 tools/core-pins.py --self-test
      - name: Each world's core.lock is its Port CI workflow's pin, inside its core_version_range
        run: python3 tools/core-pins.py --check
      - name: The private forbidden list, when configured
        env:
          FORBIDDEN_LIST: ${{ secrets.FORBIDDEN_LIST }}
        run: |
          if [ -n "$FORBIDDEN_LIST" ]; then
            umask 077
            printf '%s\n' "$FORBIDDEN_LIST" > "$RUNNER_TEMP/forbidden.txt"
            echo "MODDY_FORBIDDEN_FILE=$RUNNER_TEMP/forbidden.txt" >> "$GITHUB_ENV"
            echo "leak scan: with the private forbidden list"
          else
            echo "::notice::no FORBIDDEN_LIST secret: the leak scan runs the built-in and committed rules only"
          fi
      - name: Leak scan, every tracked file
        run: python3 tools/leak-scan.py --tree
      - name: Leak scan, every commit in the history
        run: python3 tools/leak-scan.py --commits -- HEAD
      - name: Secret scan, the tree and the history
        run: |
          python3 tools/secret-scan.py --tree
          python3 tools/secret-scan.py --history
      - name: Licence scan, the tree, the register and the history
        run: |
          python3 tools/licence-scan.py --tree
          python3 tools/licence-scan.py --range -- HEAD

  worlds:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      list: ${{ steps.pick.outputs.list }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: pick
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ -n "$BASE" ]; then list="$(python3 tools/changed-worlds.py --base "$BASE")"; else list="$(python3 tools/changed-worlds.py --all)"; fi
          echo "worlds to build: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  world:
    needs: worlds
    if: ${{ needs.worlds.outputs.list != '[]' }}
    strategy:
      fail-fast: false
      matrix:
        world: ${{ fromJSON(needs.worlds.outputs.list) }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      # The world's Gradle `build`: the core core.lock pins (downloaded and sha256-checked by shared/level.gradle),
      # unit tests, the jar, checkLevelJar and licenceCheck.
      - name: Build, unit tests and the jar checks
        env:
          WORLD: ${{ matrix.world }}
        run: ./gradlew --no-daemon -p "$WORLD" build
      # The built jar, so a pull request's build can be downloaded and tried before it merges (7 days; a login is needed).
      - name: The jar
        uses: actions/upload-artifact@v4
        with:
          name: jar-${{ matrix.world }}
          path: ${{ matrix.world }}/build/libs/*.jar
          retention-days: 7
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.world }}-test-reports
          path: ${{ matrix.world }}/build/reports/tests/
          retention-days: 7
