# The Isle level jar. Minecraft and NeoForge are the public core's: they must match the core jar pinned in core.lock.
org.gradle.jvmargs=-Xmx2G
org.gradle.daemon=true
org.gradle.caching=true

minecraft_version=1.21.10
minecraft_version_range=[1.21.10,1.21.11)
neo_version=21.10.64
java_version=21
# This Minecraft's data-pack format: the level marker pack declares it (shared/level.gradle).
level_pack_format=88

mod_id=moddyisle
mod_name=Moddy Scarcity Isle
mod_version=0.1.3
mod_license=MPL-2.0
mod_authors=Moddy contributors
mod_description=Scarcity Isle, a Moddy level: a tiny island in the sky for every player, and a wish bank where every wish counts.
# The core mod it requires, and the version range it accepts.
core_mod_id=moddingfromamod
core_version_range=[1.0.8,)
# The level's own Java packages besides com.moddingfromamod.levels.<level> (its @Mod class and the shared code):
# tools/check-level-jar.py refuses a class anywhere else in the jar.
level_packages=com/moddingfromamod/isle,com/moddingfromamod/bank
