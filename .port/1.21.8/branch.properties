# MMVU's version-branch marker for Minecraft 1.21.8, the version every world here builds for. With it, each world's
# Port CI gates (MMVU's ci-gates.py, read from the repository root for every world folder) take MMVU's gate harness for
# 1.21.1 and rename it for 1.21.8 (base_minecraft_version): MMVU has no other route for a 1.21.8 build. The core
# repository gates its 1.21.8 line the same way. Change it on main, by pull request.
base_minecraft_version=1.21.1
