# Version branch neoforge-26.3 (MMVU fork-versions shape, made by hand: two mods in one repository):
# Minecraft 26.3 on NeoForge 26.3.0.117, Java 25, ModDevGradle 2.0.148 with NeoForm runtime 2.0.31.
# Started speculatively from the local 26.2 work while the core's 26.2 asset was held; neoforge-26.2 is merged up
# once it is released.
minecraft_version=26.3
branch=neoforge-26.3
parent=neoforge-26.2
parent_minecraft_version=26.2
port_branch=neoforge-1.21.8
