# Version branch neoforge-1.21.10 (MMVU fork-versions shape, made by hand: this repository holds two mods, which
# fork-branches.py does not model yet): Minecraft 1.21.10 on NeoForge 21.10.64, both worlds (isle, arena).
minecraft_version=1.21.10
branch=neoforge-1.21.10
parent=neoforge-1.21.8
parent_minecraft_version=1.21.8
port_branch=neoforge-1.21.8
# base_minecraft_version is the port branch's own Minecraft version (neoforge-1.21.8: the cascade and the
# shared-helper span read it); harness_base is the gate harness Port CI renames for this version (PORT_BRANCH_BASE)
base_minecraft_version=1.21.8
harness_base=1.21.1
prop.minecraft_version=1.21.10
prop.minecraft_version_range=[1.21.10,1.21.11)
prop.neo_version=21.10.64
prop.level_pack_format=88
java_version=21
# BEGIN layer-deps (tools/layer-deps.py)
# per-target builds of the authors' pinned dependencies; DEPS.md says where each came from
# the core: its own neoforge-1.21.10 release, by sha256 (was core_tag=moddingfromamod-1.0.9-mc1.21.10; each world's core.lock keeps core_*)
substitute.com.moddingfromamod\:moddingfromamod=com.moddingfromamod:moddingfromamod:1.0.9
port_jar.com.moddingfromamod\:moddingfromamod=https://github.com/jivinstev/ModdyTheWishWatch/releases/download/moddingfromamod-1.0.9-mc1.21.10/moddingfromamod-1.0.9+mc1.21.10.jar 634268997619158030b6499ec3978e0a7bde1814d1df11ba374433f88f6a92db
# END layer-deps
