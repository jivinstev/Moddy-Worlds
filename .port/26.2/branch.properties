# Version branch neoforge-26.2 (MMVU fork-versions shape, made by hand: two mods in one repository):
# Minecraft 26.2 on NeoForge 26.2.0.95, Java 25, ModDevGradle 2.0.148 with NeoForm runtime 2.0.31.
# The core's 26.2 release is 1.0.9 (the core ladder moved to 1.0.9 on 2026-11-24).
minecraft_version=26.2
branch=neoforge-26.2
parent=neoforge-26.1.2
parent_minecraft_version=26.1.2
port_branch=neoforge-1.21.8
